# ==============================================================================
# BEDAAR AI SHIELD - Project-wide Gradle settings
# ==============================================================================

# Memory settings for faster builds
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX support for modern libraries
android.useAndroidX=true
android.enableJetifier=true

# Architectures to build (Standard for most phones)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (Fabric/TurboModules) - Keep false for stability
newArchEnabled=false

# Hermes JS Engine (Recommended for performance)
hermesEnabled=true

# User Specific Paths (Based on your system)
org.gradle.java.home=D:/JDK17
gradle.user.home=D:/AndroidSDK/.gradle
android.overridePathCheck=true

# API 35 Compatibility Fix (Crucial for Vision Camera)
android.suppressUnsupportedCompileSdk=35

# KSP & AsyncStorage Settings
ksp.incremental=false
ksp.incremental.intermodule=false
AsyncStorage_useKsp=false

# ==============================================================================